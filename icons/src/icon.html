<!DOCTYPE html>
<!-- Source of the app icons, rendered by icons/render.mjs: ?t=outheis|ergonoi&s=<size>.
     outheis: Pearl Aqua over Wisteria, M in Inter 600, as the Agenda icon; ergonoi: the light
     Wisteria of its header, lighter towards the top, M in Mona Sans Mono Bold. Fonts from ../../fonts (OFL). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family:Inter; font-weight:100 900; src:url(../../fonts/inter-latin-wght.woff2); }
@font-face { font-family:Mona; font-weight:700; src:url(../../fonts/mona-sans-mono-bold-latin.woff2); }
html, body { margin:0; }
#icon { position:relative; overflow:hidden; }
#icon span { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; line-height:1; }
.outheis { background:linear-gradient(#97EAD2 0 37.5%, #C490D1 37.5% 100%); }
.outheis span { color:#460A46; font-family:Inter; font-weight:600; }
.ergonoi { background:linear-gradient(#ECDCF0, #E2C8E8); } /* lighter towards the top, as the Agenda icon */
.ergonoi span { color:#1A1A1A; font-family:Mona; font-weight:700; }
</style></head><body><div id="icon"><span>M</span></div>
<script>
const q = new URLSearchParams(location.search), s = Number(q.get("s")) || 512, t = q.get("t") || "outheis";
const el = document.getElementById("icon");
el.className = t; el.style.width = el.style.height = s + "px";
// kept inside the round mask of Android (the inner 80 %)
el.querySelector("span").style.fontSize = (s * (t === "ergonoi" ? 150 : 128) / 180) + "px";
</script></body></html>
